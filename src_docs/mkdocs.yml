# this_file: src_docs/mkdocs.yml
site_name: FontLab Scriptmix
site_description: FontLab Scriptmix complete guides, source provenance and usage.
site_url: https://code.fontlab.com/fontlab-python-scriptmix/
repo_url: https://github.com/fontlabcom/fontlab-python-scriptmix
repo_name: fontlabcom/fontlab-python-scriptmix
docs_dir: md
site_dir: ../docs
use_directory_urls: false
theme:
  name: fly-january-remote
  language: en
  palette:
    scheme: default
  features:
    - search.highlight
    - content.code.copy
plugins:
  - fly
  - search:
      lang: [en]
markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
extra:
  fly:
    chrome: fontlab
    chrome_options:
      site-label: Scriptmix
      mobile-menu: materialx
      mobile-search: materialx
validation:
  links:
    not_found: warn
    anchors: warn
exclude_docs: |
  includes/**
hooks:
  - english_search.py
