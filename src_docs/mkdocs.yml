# this_file: src_docs/mkdocs.yml
site_name: FontLab Scriptmix
site_description: Scripts, reports and drawing panels for FontLab.
site_url: https://fontlabcom.github.io/fontlab-python-scriptmix/
repo_url: https://github.com/fontlabcom/fontlab-python-scriptmix
edit_uri: edit/main/src_docs/md/
docs_dir: md
site_dir: ../.build/site
use_directory_urls: false
theme:
  name: materialx
  custom_dir: overrides
  search_index_only: true
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.path
  - navigation.top
  - content.code.copy
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: indigo
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
plugins:
- materialx/search:
    lang: en
- materialx/meta
- materialx/tags
- awesome-nav
- categories:
    base_name: topics
    no_nav: true
    show_breadcrumbs: true
- codeinclude:
    title_mode: mkdocs-material
    block_throw: true
- include-markdown:
    comments: false
- live-edit:
    user_docs_dir: src_docs/md
- autorefs
- mkdocstrings:
    handlers:
      python:
        paths:
        - .
        options:
          allow_inspection: false
          show_source: false
- print-site:
    add_to_navigation: true
    print_page_title: Print this documentation
markdown_extensions:
- attr_list
- md_in_html
- tables
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
extra_css:
- https://i.fontlab.com/fltheme26/1.0.0/components.css
- https://i.fontlab.com/fltheme26/1.0.0/theme.css
extra_javascript:
- https://i.fontlab.com/fltheme26/1.0.0/basecoat.js
- https://i.fontlab.com/fltheme26/1.0.0/theme.js
validation:
  links:
    not_found: warn
    anchors: warn
  nav:
    omitted_files: info
exclude_docs: 'includes/**

  '
