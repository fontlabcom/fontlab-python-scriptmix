# this_file: src_docs/mkdocs.yml
site_name: FontLab Scriptmix
site_description: FontLab Scriptmix complete guides, source provenance and usage.
site_url: https://code.fontlab.com/fontlab-python-scriptmix/
repo_url: https://github.com/fontlabcom/fontlab-python-scriptmix
repo_name: fontlabcom/fontlab-python-scriptmix
docs_dir: md
site_dir: ../docs
use_directory_urls: false
theme:
  name: materialx
  language: en
  custom_dir: overrides
  palette:
    scheme: default
  features:
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang: [en]
markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
extra_css:
  - stylesheets/local.css
  - https://i.fontlab.com/fltheme26/1.0.0/components.css
  - https://i.fontlab.com/fltheme26/1.0.0/theme.css
extra_javascript:
  - https://i.fontlab.com/fltheme26/1.0.0/basecoat.js
  - https://i.fontlab.com/fltheme26/1.0.0/theme.js
validation:
  links:
    not_found: warn
    anchors: warn
exclude_docs: |
  includes/**
hooks:
  - english_search.py
