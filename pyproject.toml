# this_file: pyproject.toml
[project]
name = "fontlab-python-scriptmix-docs"
version = "0.1.0"
description = "Local documentation build for fontlab-python-scriptmix"
requires-python = ">=3.12"
dependencies = [
    "properdocs==1.6.7", "mkdocs-materialx==10.1.5",
    "mkdocstrings==1.0.7", "mkdocstrings-python==2.0.9",
    "mkdocs-autorefs==1.4.4", "griffe==2.3.2", "pymdown-extensions>=10.2",
    "mkdocs-codeinclude-plugin==0.3.1",
    "mkdocs-awesome-nav==3.3.0",
    "mkdocs-live-edit-plugin==0.4.1",
    "mkdocs-categories-plugin==0.6.0",
    "mkdocs-print-site-plugin==2.9",
    "mkdocs-include-markdown-plugin==7.3.0",
]
[dependency-groups]
dev = ["pytest>=8", "playwright>=1.55"]
[tool.uv]
package = false

[tool.ruff.lint.per-file-ignores]
# Frozen provenance pins: these eight proposed sources must stay byte-identical to
# menu-consolidations.json source_commit 8022be9c (see menu_layout.consolidation_rows).
"Scripts/Anchors/Cloud View.py" = ["E741"]
"Scripts/Components/Count Badges.py" = ["E741"]
"Scripts/Kerning/Classes Browser.py" = ["E402", "E741"]
"Scripts/Kerning/Compare Masters.py" = ["E402"]
"Scripts/Kerning/Missing Pairs.py" = ["E402", "E741"]
"Scripts/Kerning/Pair List Browser.py" = ["E402", "E741"]
"Scripts/Kerning/Remove Small Pairs.py" = ["E741"]
"Scripts/Kerning/Text Preview.py" = ["E402"]

[tool.fontlab-install]
id = "com.fontlab.python-scriptmix"
name = "fontlab-python-scriptmix"
packages = []  # scripts only
dependencies = ["fontlab-fly>=1.2.0", "fontlab-fontlabapp>=1.2.0", "fonttools", "glyphslib"]  # not the docs toolchain above
